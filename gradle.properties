# 2048m non basta più: con AGP 8.9 / compileSdk 36 R8 gira nel processo Gradle
# e va in OutOfMemory sul task minifyReleaseWithR8.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
# Il daemon Kotlin non eredita org.gradle.jvmargs: senza questa riga la
# compilazione release va in OOM ("Not enough memory to run compilation").
kotlin.daemon.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
